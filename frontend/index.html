<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infection Prevention Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F3F5F4;--surface:#FFFFFF;--surface2:#F8FAF9;--ink:#152429;--muted:#58686D;--line:#DCE3E2;
  --violet:#56399A;--violet-soft:#ECE6F8;--pink:#BE3A68;--pink-soft:#FBE7EE;
  --bad:#B4372A;--bad-soft:#FBE8E4;--warn:#9A6210;--warn-soft:#FBF0DC;--good:#2B7553;--good-soft:#E2F1E8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1618;--surface:#162023;--surface2:#1B272A;--ink:#E4ECEB;--muted:#97A9AC;--line:#28373A;
  --violet:#AC97EA;--violet-soft:#29233F;--pink:#EE82A8;--pink-soft:#3A1F2C;
  --bad:#F28A79;--bad-soft:#3B201B;--warn:#E4B35C;--warn-soft:#372B16;--good:#6CC89D;--good-soft:#163024;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1618;--surface:#162023;--surface2:#1B272A;--ink:#E4ECEB;--muted:#97A9AC;--line:#28373A;
  --violet:#AC97EA;--violet-soft:#29233F;--pink:#EE82A8;--pink-soft:#3A1F2C;
  --bad:#F28A79;--bad-soft:#3B201B;--warn:#E4B35C;--warn-soft:#372B16;--good:#6CC89D;--good-soft:#163024;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--violet)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.brand{padding:4px 10px 18px;display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.02rem;line-height:1.1;display:block}
.brand span{font-size:.78rem;color:var(--muted)}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem}
nav.side a:hover{background:var(--surface2)}
nav.side a[aria-current="page"]{background:var(--violet-soft);color:var(--violet);font-weight:700}
nav.side a .count{margin-left:auto;background:var(--bad);color:var(--surface);border-radius:999px;font-size:.72rem;padding:1px 7px;font-weight:700}
nav.side .grp{font-size:.78rem;color:var(--muted);padding:14px 12px 4px}
main{padding:24px clamp(16px,3vw,40px) 64px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.topbar p{color:var(--muted);margin-top:4px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
textarea{min-height:80px;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--surface)}
.btn.small{min-height:32px;padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel + .panel,.stack > * + *{margin-top:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph p{color:var(--muted);font-size:.9rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.demo{background:var(--violet-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-bottom:18px}

/* briefing */
.briefing{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.briefing header{padding:22px 24px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.briefing header p{color:var(--muted)}
.q{display:grid;grid-template-columns:6px 1fr;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .bar{background:var(--line)}
.q.bad .bar{background:var(--bad)}.q.warn .bar{background:var(--warn)}.q.good .bar{background:var(--good)}.q.info .bar{background:var(--violet)}
.q .body{padding:18px 24px;display:grid;grid-template-columns:minmax(200px,1fr) minmax(240px,1.4fr);gap:8px 28px}
.q .ask{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.25}
.q.lead .ask{font-size:1.5rem}
.q .verdict{font-family:var(--display);font-weight:800;font-size:1.25rem}
.q.bad .verdict{color:var(--bad)}.q.warn .verdict{color:var(--warn)}.q.good .verdict{color:var(--good)}.q.info .verdict{color:var(--violet)}
.q .detail{color:var(--muted);margin-top:4px}
.q ul{margin:6px 0 0;padding-left:18px}
.q li{margin:3px 0}
@media (max-width:760px){.q .body{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}
.kpi{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-right:-1px;margin-bottom:-1px}
.kpi .v{font-family:var(--display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:.85rem;color:var(--muted)}
.kpi .d{font-size:.8rem;margin-top:2px}
.up-bad{color:var(--bad)}.down-good{color:var(--good)}.up-good{color:var(--good)}.down-bad{color:var(--bad)}
.chartbox{position:relative;height:260px}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted);font-size:.84rem}
td.num,th.num{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.good{background:var(--good-soft);color:var(--good)}.pill.info{background:var(--violet-soft);color:var(--violet)}.pill.mute{background:var(--surface2);color:var(--muted)}
.cell-bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.cell-warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.cell-good{color:var(--good)}
.heat td.h{text-align:center;font-weight:700;min-width:56px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--violet);border-bottom-color:var(--violet)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;min-height:100px;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--violet)}
.tile[aria-pressed="true"]{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}
.tile b{font-family:var(--display);font-size:1.05rem}
.tile span{color:var(--muted);font-size:.86rem}
.tile .src{margin-top:auto;font-size:.76rem;color:var(--pink);font-weight:700}
form.entry{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 14px;margin-top:6px}
form.entry label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:700}
form.entry label.wide{grid-column:1/-1}
form.entry .actions{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.calc{grid-column:1/-1;background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-weight:700;max-width:90vw}
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.list li:last-child{border-bottom:0}
.list .main{flex:1;min-width:220px}
.alert{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.alert .bar{border-radius:3px;align-self:stretch}
.alert.bad .bar{background:var(--bad)}.alert.warn .bar{background:var(--warn)}.alert.info .bar{background:var(--violet)}
.alert b{display:block}
.ai-out{white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:14px;margin-top:12px;font-size:.95rem}
.report{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:28px;max-width:900px}
.report h2{margin:22px 0 8px}.report h2:first-of-type{margin-top:8px}
.report p{margin:6px 0;max-width:72ch}
.empty{padding:28px;text-align:center;color:var(--muted)}
.quizq{margin:14px 0}
.quizq fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.quizq legend{font-weight:700;padding:0 6px}
.quizq label{display:flex;gap:8px;padding:5px 0;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);z-index:20;padding-top:calc(8px + env(safe-area-inset-top,0px));top:0}
  .brand,nav.side .grp{display:none}
  nav.side a{white-space:nowrap;padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<nav class="side" id="nav" aria-label="Sections">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="12" cy="13" r="7" fill="var(--violet)"/><circle cx="23" cy="20" r="7" fill="var(--pink)" opacity=".9"/><circle cx="14" cy="25" r="4" fill="var(--violet)" opacity=".55"/></svg>
    <div><b>Infection Prevention Intelligence</b><span id="hospName">Demo Hospital</span></div>
  </div>
  <a href="#overview" data-r="overview">Overview</a>
  <a href="#record" data-r="record">Record data</a>
  <a href="#review" data-r="review">Review and data quality <span class="count" id="reviewCount" hidden></span></a>
  <div class="grp">Analyse</div>
  <a href="#surveillance" data-r="surveillance">Surveillance</a>
  <a href="#stewardship" data-r="stewardship">Stewardship</a>
  <a href="#warning" data-r="warning">Early warning</a>
  <a href="#alerts" data-r="alerts">Alerts <span class="count" id="alertCount" hidden></span></a>
  <div class="grp">Act</div>
  <a href="#reports" data-r="reports">Reports</a>
  <a href="#accreditation" data-r="accreditation">Accreditation</a>
  <a href="#learning" data-r="learning">Learning</a>
  <a href="#thresholds" data-r="thresholds">Thresholds</a>
</nav>
<main id="main"><div class="empty">Loading surveillance data…</div></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="local-runtime.js"></script>
<script>
"use strict";
/* ---------- state ---------- */
const S={wards:{},monthly:{},entries:[],actions:[],ra:[],audits:[],policies:[],quiz:[],th:null,content:{},alertState:{},loaded:new Set(),month:null,db:null,user:null,sample:null,downloads:null,canWrite:true,uid:null,names:{}};
const DEFAULT_TH={hhTarget:80,cauti:3.0,clabsi:3.0,vap:6.0,ssi:2.5,ucDU:0.4,clDU:0.5,ventDU:0.4,rxTarget:80,mdroRise:1.5,envTarget:95,abgMin:30};
const TH=()=>Object.assign({},DEFAULT_TH,S.th||{});
const ORGS=["CRE","MRSA","VRE","ESBL","CRAB"];
const ORG_NAMES={CRE:"Carbapenem-resistant Enterobacterales",MRSA:"Methicillin-resistant S. aureus",VRE:"Vancomycin-resistant Enterococcus",ESBL:"ESBL producers",CRAB:"Carbapenem-resistant A. baumannii"};
const HAI=[{k:"cauti",n:"CAUTI",den:"ucDays",unit:"per 1,000 catheter-days"},{k:"clabsi",n:"CLABSI",den:"clDays",unit:"per 1,000 central-line days"},{k:"vap",n:"VAP",den:"ventDays",unit:"per 1,000 ventilator-days"}];
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mLabel=m=>{const[y,mo]=m.split("-");return MN[+mo-1]+" "+y};
const mShort=m=>{const[y,mo]=m.split("-");return MN[+mo-1]+" ’"+y.slice(2)};
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1=v=>v==null||!isFinite(v)?"–":(Math.round(v*10)/10).toFixed(1);
const r0=v=>v==null||!isFinite(v)?"–":Math.round(v).toLocaleString("en-IN");
const rate=(n,d,k)=>d>0?n/d*k:null;
const wardName=id=>S.wards[id]?.name||id;
const wardIds=()=>Object.keys(S.wards).sort((a,b)=>(S.wards[a].type===S.wards[b].type?0:S.wards[a].type==="icu"?-1:1)||wardName(a).localeCompare(wardName(b)));
const blankWard=()=>({patientDays:0,ucDays:0,clDays:0,ventDays:0,cauti:0,clabsi:0,vap:0,procedures:0,ssi:0,nsi:0,hhOpp:0,hhCompliant:0,mdro:{CRE:0,MRSA:0,VRE:0,ESBL:0,CRAB:0},rxReviewed:0,rxAppropriate:0});
function months(){
  const set=new Set(Object.keys(S.monthly));
  S.entries.forEach(e=>e.month&&set.add(e.month));
  return [...set].sort();
}
const aggCache=new Map();
function agg(m){
  if(aggCache.has(m))return aggCache.get(m);
  const base=S.monthly[m]||{};
  const W={};
  wardIds().forEach(w=>{const b=base.wards?.[w];W[w]=Object.assign(blankWard(),b?JSON.parse(JSON.stringify(b)):{});W[w].mdro=Object.assign(blankWard().mdro,W[w].mdro||{})});
  const abx=JSON.parse(JSON.stringify(base.abx||{}));
  const env=JSON.parse(JSON.stringify(base.env||{air:{tested:0,passed:0},water:{tested:0,passed:0},surface:{tested:0,passed:0}}));
  for(const e of S.entries){
    if(e.month!==m||e.voided)continue;
    const w=W[e.ward];
    switch(e.kind){
      case"hh":if(w){w.hhOpp+=+e.opp||0;w.hhCompliant+=+e.compliant||0}break;
      case"census":if(w){w.patientDays+=+e.patients||0;w.ucDays+=+e.uc||0;w.clDays+=+e.cl||0;w.ventDays+=+e.vent||0}break;
      case"hai":if(w&&w[e.type]!=null&&(e.status||"confirmed")==="confirmed")w[e.type]+=1;break;
      case"proc":if(w)w.procedures+=+e.count||0;break;
      case"nsi":if(w)w.nsi+=1;break;
      case"isolate":if(w&&e.org in w.mdro)w.mdro[e.org]+=1;break;
      case"rxaudit":if(w){w.rxReviewed+=e.reviewed!=null?+e.reviewed:1;w.rxAppropriate+=e.appropriate!=null?+e.appropriate:(e.outcome==="Appropriate"?1:0)}break;
      case"env":{const t=env[e.type]||(env[e.type]={tested:0,passed:0});t.tested+=1;if(e.result==="pass")t.passed+=1}break;
      case"abx":{const a=abx[e.drug]||(abx[e.drug]={ddd:0,dot:0});a.ddd+=+e.ddd||0;a.dot+=+e.dot||0}break;
    }
  }
  const T=blankWard();
  for(const w of Object.values(W)){for(const k in T){if(k==="mdro")ORGS.forEach(o=>T.mdro[o]+=w.mdro[o]||0);else T[k]+=w[k]||0}}
  const out={wards:W,total:T,abx,env,days:base.days||null};
  aggCache.set(m,out);return out;
}
function met(x){
  const t=TH();
  return {hh:rate(x.hhCompliant,x.hhOpp,100),cauti:rate(x.cauti,x.ucDays,1000),clabsi:rate(x.clabsi,x.clDays,1000),vap:rate(x.vap,x.ventDays,1000),
  ssi:rate(x.ssi,x.procedures,100),ucDU:rate(x.ucDays,x.patientDays,1),clDU:rate(x.clDays,x.patientDays,1),ventDU:rate(x.ventDays,x.patientDays,1),
  dai:rate(x.cauti+x.clabsi+x.vap,x.ucDays+x.clDays+x.ventDays,1000),rx:rate(x.rxAppropriate,x.rxReviewed,100),mdroTotal:ORGS.reduce((s,o)=>s+(x.mdro[o]||0),0),nsi:x.nsi};
}
const prevMonths=(m,n)=>{const ms=months();const i=ms.indexOf(m);return ms.slice(Math.max(0,i-n),i)};
function series(fn,upTo){const ms=months().filter(m=>!upTo||m<=upTo).slice(-12);return{ms,vals:ms.map(m=>fn(agg(m)))}}
function ddd100(a){const pd=a.total.patientDays;let s=0;for(const d in a.abx)s+=a.abx[d].ddd||0;return rate(s,pd,100)}
function dot1000(a){const pd=a.total.patientDays;let s=0;for(const d in a.abx)s+=a.abx[d].dot||0;return rate(s,pd,1000)}
function sev(v,limit,higherBad=true){if(v==null)return"";if(higherBad){if(v>limit)return"bad";if(v>limit*.8)return"warn";return"good"}else{if(v<limit)return"bad";if(v<limit+5)return"warn";return"good"}}
/* ---------- analysis ---------- */
function wardRisk(m){
  const a=agg(m),t=TH(),out=[];
  for(const w of wardIds()){
    const x=a.wards[w],k=met(x);let score=0;const why=[];
    for(const h of HAI){const v=k[h.k];if(v!=null&&v>t[h.k]){score+=v/t[h.k];why.push(`${h.n} ${r1(v)} vs ${t[h.k]} target`)}}
    if(k.ssi!=null&&k.ssi>t.ssi){score+=k.ssi/t.ssi;why.push(`SSI ${r1(k.ssi)}% vs ${t.ssi}%`)}
    if(k.hh!=null&&k.hh<t.hhTarget){score+=(t.hhTarget-k.hh)/8;why.push(`hand hygiene ${r0(k.hh)}%`)}
    if(x.hhOpp===0){score+=1;why.push("no hand hygiene audit this month")}
    const hot=(x.mdro.CRE||0)+(x.mdro.CRAB||0);if(hot>=2){score+=hot*.5;why.push(`${hot} CRE/CRAB isolates`)}
    out.push({w,score,why});
  }
  return out.sort((a,b)=>b.score-a.score);
}
function stats(arr){const v=arr.filter(x=>x!=null&&isFinite(x));if(!v.length)return null;const mean=v.reduce((s,x)=>s+x,0)/v.length;const sd=Math.sqrt(v.reduce((s,x)=>s+(x-mean)**2,0)/v.length);return{mean,sd,n:v.length}}

  }else if(survTab==="hai"){

    body=`<div class="panel"><div class="ph"><h2>${h.n} by ward, ${mLabel(m)}</h2><div class="ctrls">${H.map(x=>`<button class="btn small${x.k===haiType?" primary":""}" data-hai="${x.k}">${x.n}</button>`).join("")}</div></div><p class="small muted" style="margin-bottom:10px">${h.k==="ssi"?"Infections ÷ procedures × 100":`Infections ÷ ${h.den==="ucDays"?"catheter":h.den==="clDays"?"central-line":"ventilator"} days × 1,000`}. Target ${t[h.k]} ${h.unit}. Only confirmed cases are counted${(()=>{const n=S.entries.filter(e=>e.kind==="hai"&&e.type===h.k&&e.month===m&&!e.voided&&(e.status==="suspected"||e.status==="review")).length;return n?`; ${n} more ${n>1?"are":"is"} <a href="#review">awaiting review</a>`:""})()}.</p>

function daysElapsed(m){const t=today();const[y,mo]=m.split("-").map(Number);const dim=new Date(y,mo,0).getDate();if(t.slice(0,7)===m)return +t.slice(8);return t.slice(0,7)<m?0:dim}
function completeness(m){
  const a=agg(m),base=!!S.monthly[m],ents=S.entries.filter(e=>e.month===m&&!e.voided),rows=[],exp=daysElapsed(m);let gaps=0;
  for(const w of wardIds()){const x=a.wards[w];const hhN=ents.filter(e=>e.kind==="hh"&&e.ward===w).length;
    const hh=x.hhOpp>0?{ok:true,t:hhN?`${hhN} audit${hhN>1?"s":""} recorded${base?" plus monthly totals":""}`:"Monthly totals on file"}:{ok:false,t:"No audit"};
    const cd=new Set(ents.filter(e=>e.kind==="census"&&e.ward===w).map(e=>e.date)).size;

    const den=[];HAI.forEach(h=>{if(x[h.k]>0&&!x[h.den])den.push(`${h.n} cases but no ${h.den==="ucDays"?"catheter":h.den==="clDays"?"line":"ventilator"}-days`)});if(x.ssi>0&&!x.procedures)den.push("SSI cases but no procedures");if(!x.patientDays)den.push("No patient-days");

const REPORTS=[["ipc","Monthly IPC report"],["ams","Monthly AMS report"],["dash","Monthly dashboard"],["quarter","Quarterly trend analysis"],["annual","Annual summary"]];
function quarterOf(m){const[y,mo]=m.split("-").map(Number);const q=Math.floor((mo-1)/3);return{label:`Q${q+1} ${y}`,ms:[0,1,2].map(i=>`${y}-${String(q*3+i+1).padStart(2,"0")}`)}}
function metricRows(ms){const t=TH();const rows=[["Hand hygiene compliance (%)",a=>met(a.total).hh,r0,`target ${t.hhTarget}`],["CAUTI per 1,000 catheter-days",a=>met(a.total).cauti,r1,`target ${t.cauti}`],["CLABSI per 1,000 line-days",a=>met(a.total).clabsi,r1,`target ${t.clabsi}`],["VAP per 1,000 ventilator-days",a=>met(a.total).vap,r1,`target ${t.vap}`],["SSI (% of procedures)",a=>met(a.total).ssi,r1,`target ${t.ssi}`],["Antibiotic DDD per 100 patient-days",a=>ddd100(a),r1,""],["Prescriptions meeting policy (%)",a=>met(a.total).rx,r0,`target ${t.rxTarget}`],["MDRO isolates",a=>met(a.total).mdroTotal,r0,""],["CRE isolates",a=>a.total.mdro.CRE||0,r0,""],["Needle-stick injuries",a=>a.total.nsi,r0,""]];
  return `<div class="tablewrap"><table><thead><tr><th>Measure</th>${ms.map(x=>`<th class="num">${mShort(x)}</th>`).join("")}<th>Reference</th></tr></thead><tbody>${rows.map(([n,f,fmt,ref])=>`<tr><td>${n}</td>${ms.map(x=>`<td class="num">${S.monthly[x]||S.entries.some(e=>e.month===x)?fmt(f(agg(x))):"–"}</td>`).join("")}<td class="muted small">${ref}</td></tr>`).join("")}</tbody></table></div>`}
function wardHaiTable(m){const a=agg(m),t=TH();return `<div class="tablewrap"><table><thead><tr><th>Ward</th><th class="num">Hand hygiene</th><th class="num">CAUTI</th><th class="num">CLABSI</th><th class="num">VAP</th><th class="num">SSI %</th><th class="num">MDRO</th></tr></thead><tbody>${wardIds().map(w=>{const x=a.wards[w],k=met(x);return `<tr><td>${esc(wardName(w))}</td><td class="num">${x.hhOpp?r0(k.hh)+"%":"Not audited"}</td>${["cauti","clabsi","vap"].map(h=>`<td class="num ${k[h]!=null&&k[h]>t[h]?"cell-bad":""}">${r1(k[h])}</td>`).join("")}<td class="num">${r1(k.ssi)}</td><td class="num">${k.mdroTotal}</td></tr>`}).join("")}</tbody></table></div>`}
function reportHtml(type,m){
  const a=agg(m),k=met(a.total),al=alerts(m),hosp=S.hospital||"Demo Hospital";
  const narr=repNarr[type+m]?`<h2>Summary</h2><p>${esc(repNarr[type+m]).replace(/\n\n/g,"</p><p>")}</p>`:"";
  const head=(title,period)=>`<h1>${title}</h1><p class="muted">${esc(hosp)}. ${period}. Generated ${fmtDate(today())}.</p>`;
  const openAct=S.actions.filter(c=>c.status!=="done");
  const actTable=openAct.length?`<div class="tablewrap"><table><thead><tr><th>Action</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>${openAct.map(c=>`<tr><td style="white-space:normal">${esc(c.title)}</td><td>${esc(c.owner)}</td><td>${fmtDate(c.due)}</td><td>${isOverdue(c.due)?"Overdue":"Open"}</td></tr>`).join("")}</tbody></table></div>`:"<p>No open corrective actions.</p>";
  if(type==="ipc")return head("Infection prevention and control report",mLabel(m))+narr+`<h2>Key measures</h2>${metricRows(months().filter(x=>x<=m).slice(-3))}<h2>By ward</h2>${wardHaiTable(m)}<h2>Environmental surveillance</h2><p>${["air","water","surface"].map(e=>`${e[0].toUpperCase()+e.slice(1)}: ${a.env[e]?.passed??0} of ${a.env[e]?.tested??0} samples within limits`).join(". ")}.</p><h2>Needle-stick injuries</h2><p>${a.total.nsi} reported this month.</p><h2>Alerts raised</h2>${al.filter(x=>x.sev!=="info").length?`<ul>${al.filter(x=>x.sev!=="info").map(x=>`<li>${esc(x.title)}. ${esc(x.detail)}</li>`).join("")}</ul>`:"<p>None.</p>"}<h2>Corrective actions</h2>${actTable}`;
  if(type==="ams"){const pd=a.total.patientDays;const ra=S.ra.filter(r=>(r.date||"").startsWith(m));return head("Antimicrobial stewardship report",mLabel(m))+narr+`<h2>Consumption</h2><p>Total ${r1(ddd100(a))} DDD per 100 patient-days and ${r0(dot1000(a))} days of therapy per 1,000 patient-days.</p><div class="tablewrap"><table><thead><tr><th>Antibiotic</th><th class="num">DDD per 100 patient-days</th><th class="num">DOT per 1,000 patient-days</th></tr></thead><tbody>${Object.keys(a.abx).map(d=>`<tr><td>${esc(d)}</td><td class="num">${r1(rate(a.abx[d].ddd,pd,100))}</td><td class="num">${r1(rate(a.abx[d].dot,pd,1000))}</td></tr>`).join("")}</tbody></table></div><h2>Prescription audit</h2><p>${a.total.rxAppropriate} of ${a.total.rxReviewed} audited prescriptions (${r0(k.rx)}%) met hospital policy.</p><h2>Restricted antibiotics</h2><p>${ra.length} requests this month: ${ra.filter(r=>r.status==="approved").length} approved, ${ra.filter(r=>r.status==="rejected").length} rejected, ${ra.filter(r=>r.status==="pending").length} pending.</p><h2>Resistant organisms</h2><div class="tablewrap"><table><thead><tr><th>Ward</th>${ORGS.map(o=>`<th class="num">${o}</th>`).join("")}</tr></thead><tbody>${wardIds().map(w=>`<tr><td>${esc(wardName(w))}</td>${ORGS.map(o=>`<td class="num">${a.wards[w].mdro[o]||0}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
  if(type==="dash"){return head("Monthly dashboard",mLabel(m))+narr+`<h2>At a glance</h2><p>Hand hygiene ${r0(k.hh)}%. Device-associated infections ${r1(k.dai)} per 1,000 device-days. Antibiotic use ${r1(ddd100(a))} DDD per 100 patient-days. ${k.mdroTotal} resistant isolates, including ${a.total.mdro.CRE||0} CRE.</p><h2>Highest-risk wards</h2><ul>${wardRisk(m).filter(r=>r.score>0).slice(0,3).map(r=>`<li>${esc(wardName(r.w))}: ${esc(r.why.join("; "))}</li>`).join("")||"<li>None above thresholds.</li>"}</ul><h2>For the committee</h2><ul>${agenda(m).map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`}
  if(type==="quarter"){const q=quarterOf(m);const[y,mo]=q.ms[0].split("-").map(Number);const pq=quarterOf(`${mo<=3?y-1:y}-${String(mo<=3?mo+9:mo-3).padStart(2,"0")}`);return head("Quarterly trend analysis",`${q.label}, compared with ${pq.label}`)+narr+`<h2>Measures by month</h2>${metricRows([...pq.ms,...q.ms])}<h2>Ward position at end of quarter</h2>${wardHaiTable(m)}`}
  const ms=months().filter(x=>x<=m).slice(-12);return head("Annual summary",`${mLabel(ms[0])} to ${mLabel(m)}`)+narr+`<h2>Twelve months of key measures</h2>${metricRows(ms)}<h2>Corrective actions</h2><p>${S.actions.filter(c=>c.status==="done").length} closed, ${openAct.length} still open.</p>${actTable}`;
}
PAGES.reports={html(){
  return topbar("Reports","Generated from the data on record. Download them for the committee or for accreditation files.")+tabs(REPORTS,repType,"repTabs")+
  `<div class="ctrls" style="margin-bottom:14px">${S.sample?`<button class="btn primary" id="repAI">${repNarr[repType+S.month]?"Rewrite":"Write"} the summary with Claude</button>`:""}${S.downloads?`<button class="btn" id="repDl">Download report</button><button class="btn" id="csvDl">Download data as CSV</button>`:""}<span id="repStatus" class="small muted"></span></div>
  <article class="report" id="report">${reportHtml(repType,S.month)}</article>`;
},after(){
  document.querySelectorAll("#repTabs [data-tab]").forEach(b=>b.onclick=()=>{repType=b.dataset.tab;render(false)});
  const ai=$("#repAI");if(ai)ai.onclick=async()=>{const key=repType+S.month;ai.disabled=true;$("#repStatus").textContent="Claude is writing the summary…";
    try{const plain=$("#report").innerText.slice(0,20000);const{text}=await S.sample(`You are writing the summary section of a hospital infection prevention report for the infection control committee in an Indian hospital (NABH context). Using only the data below, write 2 short paragraphs in plain clinical English: what changed, what needs action, and who should act. Do not invent numbers. No headings, no bullet points, no markdown.\n\nREPORT DATA:\n${plain}`,{cache:false,onText:({text})=>{$("#repStatus").textContent="Writing… "+text.length+" characters"}});repNarr[key]=text.trim();render(false)}
    catch(e){$("#repStatus").textContent=sampleErr(e);ai.disabled=false}};
  const dl=$("#repDl");if(dl)dl.onclick=async()=>{const title=REPORTS.find(r=>r[0]===repType)[1];const doc=`<!doctype html><html><head><meta charset="utf-8"><title>${title} ${mLabel(S.month)}</title><style>body{font-family:Georgia,serif;max-width:860px;margin:40px auto;padding:0 20px;color:#152429;line-height:1.5}h1{font-size:26px}h2{font-size:18px;margin-top:26px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #ccd;padding:6px 8px;text-align:left}td.num,th.num{text-align:right}.muted{color:#667}.cell-bad{color:#B4372A;font-weight:bold}</style></head><body>${$("#report").innerHTML}</body></html>`;
    try{await S.downloads.save({filename:`${repType}-report-${S.month}.html`,data:doc});}catch(e){if(e?.code!=="cancelled"&&e?.code!=="declined")toast("Download didn’t start.")}};
  const cd=$("#csvDl");if(cd)cd.onclick=async()=>{const rows=[["month","ward","patient_days","catheter_days","line_days","ventilator_days","cauti","clabsi","vap","procedures","ssi","nsi","hh_opportunities","hh_compliant",...ORGS.map(o=>o.toLowerCase()),"rx_reviewed","rx_appropriate"]];
    months().forEach(m=>{const a=agg(m);wardIds().forEach(w=>{const x=a.wards[w];rows.push([m,wardName(w),x.patientDays,x.ucDays,x.clDays,x.ventDays,x.cauti,x.clabsi,x.vap,x.procedures,x.ssi,x.nsi,x.hhOpp,x.hhCompliant,...ORGS.map(o=>x.mdro[o]||0),x.rxReviewed,x.rxAppropriate])})});
    try{await S.downloads.save({filename:"ipc-surveillance-data.csv",data:rows.map(r=>r.map(v=>/[",]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(",")).join("\n")})}catch(e){}};
}};
/* ---------- accreditation ---------- */
let accTab="evidence";
function evidenceStatus(it){
  const l3=months().filter(x=>x<=S.month).slice(-3);
  const chk=(fn,label)=>{const miss=[];l3.forEach(m=>{const r=fn(agg(m));if(r!==true)miss.push(mLabel(m)+(r?": "+r:""))});return miss.length?{ok:false,note:`Missing for ${miss.join("; ")}`}:{ok:true,note:`${label}, ${mLabel(l3[0])} to ${mLabel(l3[l3.length-1])}`}};
  switch(it.id){
    case"hh-data":return chk(a=>{const m=wardIds().filter(w=>a.wards[w].hhOpp===0).map(wardName);return m.length?m.join(", "):true},"Generated from ward audits");
    case"hai-data":return chk(a=>a.total.ucDays&&a.total.clDays?true:"no device-days",`Generated from census and case records`);
    case"ssi-data":return chk(a=>a.total.procedures?true:"no procedures","Generated from OT counts and SSI cases");
    case"env-data":return chk(a=>["air","water","surface"].every(e=>a.env[e]?.tested)?true:"incomplete sampling","Generated from sample results");
    case"ams-data":{const r=chk(a=>Object.keys(a.abx).length&&a.total.rxReviewed?true:"no consumption or audit data","Generated from pharmacy and audit data");if(r.ok&&!S.content.antibiogram)return{ok:false,note:"Antibiogram not loaded"};return r}
    case"nsi-data":return{ok:true,note:"Generated from injury reports"};
    case"capa":{const od=S.actions.filter(c=>c.status!=="done"&&isOverdue(c.due)).length;return od?{ok:false,note:`${od} action${od>1?"s are":" is"} overdue`}:{ok:true,note:"All actions on time"}}
    default:return{ok:!!it.ready,note:it.ready?"Marked as filed":"Not yet marked as filed",manual:true};
  }
}
PAGES.accreditation={html(){
  let body="";
  if(accTab==="evidence"){const items=S.content.nabh?.items||[];const st=items.map(evidenceStatus);
    body=`<div class="panel"><div class="ph"><h2>NABH evidence for infection control</h2><p>${st.filter(s=>s.ok).length} of ${items.length} ready</p></div>${items.length?`<ul class="list">${items.map((it,i)=>`<li><div class="main"><b>${esc(it.title)}</b><div class="small muted">${esc(st[i].note)}</div></div><div class="ctrls"><span class="pill ${st[i].ok?"good":"warn"}">${st[i].ok?"Ready":"Gap"}</span>${st[i].manual&&S.canWrite?`<button class="btn small" data-ev="${esc(it.id)}">${it.ready?"Mark as not filed":"Mark as filed"}</button>`:""}${!st[i].manual?`<a class="btn small" style="text-decoration:none" href="#reports">Report</a>`:""}</div></li>`).join("")}</ul>`:`<p class="empty">No evidence checklist loaded.</p>`}</div>`}
  else if(accTab==="audits"){const list=S.audits.slice().sort((a,b)=>(a.status==="done")-(b.status==="done")||(a.due||"").localeCompare(b.due||""));
    body=`<div class="panel"><div class="ph"><h2>Audit calendar</h2></div><ul class="list">${list.map(u=>`<li><div class="main"><b>${esc(u.title)}</b><div class="small muted">${esc(u.frequency||"One-off")}, due ${fmtDate(u.due)}${u.doneOn?`, completed ${fmtDate(u.doneOn)}`:""}</div></div><div class="ctrls"><span class="pill ${u.status==="done"?"good":isOverdue(u.due)?"bad":daysTo(u.due)<=7?"warn":"mute"}">${u.status==="done"?"Done":isOverdue(u.due)?"Overdue":daysTo(u.due)<=7?"Due soon":"Scheduled"}</span>${u.status!=="done"&&S.canWrite?`<button class="btn small" data-aud="${u.id}">Mark done</button>`:""}</div></li>`).join("")||`<li class="muted">No audits scheduled.</li>`}</ul>
    ${S.canWrite?`<form class="entry" id="audAdd" style="margin-top:14px"><label>Audit<input name="title" required></label><label>Due date<input name="due" type="date" required></label><label>Repeats<select name="frequency"><option>Monthly</option><option>Quarterly</option><option>Annual</option><option>One-off</option></select></label><div class="actions"><button class="btn primary">Schedule audit</button></div></form>`:""}</div>`}
  else if(accTab==="policies"){const list=S.policies.slice().sort((a,b)=>policyDue(a).localeCompare(policyDue(b)));
    body=`<div class="panel"><div class="ph"><h2>Policies and SOPs</h2><p>Review reminders</p></div><div class="tablewrap"><table><thead><tr><th>Document</th><th>Last reviewed</th><th>Next review</th><th>Status</th><th></th></tr></thead><tbody>${list.map(p=>{const d=policyDue(p),od=isOverdue(d);return `<tr><td>${esc(p.title)}</td><td>${fmtDate(p.lastReviewed)}</td><td>${fmtDate(d)}</td><td><span class="pill ${od?"bad":daysTo(d)<=30?"warn":"good"}">${od?"Overdue":daysTo(d)<=30?"Due within a month":"Current"}</span></td><td>${S.canWrite?`<button class="btn small" data-pol="${p.id}">Mark reviewed today</button>`:""}</td></tr>`}).join("")}</tbody></table></div>
    ${S.canWrite?`<form class="entry" id="polAdd" style="margin-top:14px"><label>Document title<input name="title" required></label><label>Last reviewed<input name="lastReviewed" type="date" required></label><label>Review every (months)<input name="everyMonths" type="number" min="1" value="12" required></label><div class="actions"><button class="btn primary">Add document</button></div></form>`:""}</div>`}
  else{const list=S.actions.slice().sort((a,b)=>(a.status==="done")-(b.status==="done")||(a.due||"").localeCompare(b.due||""));
    body=`<div class="panel"><div class="ph"><h2>Corrective actions</h2><button class="btn small primary" id="newAct">Add corrective action</button></div><ul class="list">${list.map(c=>`<li><div class="main"><b>${esc(c.title)}</b><div class="small muted">${c.ward?esc(wardName(c.ward))+", ":""}${esc(c.owner||"Unassigned")}, due ${fmtDate(c.due)}${c.source?`. Triggered by ${esc(c.source)}`:""}</div></div><div class="ctrls"><span class="pill ${c.status==="done"?"good":isOverdue(c.due)?"bad":"mute"}">${c.status==="done"?"Closed":isOverdue(c.due)?"Overdue":"Open"}</span>${c.status!=="done"&&S.canWrite?`<button class="btn small" data-act="${c.id}">Close</button>`:""}</div></li>`).join("")||`<li class="muted">No corrective actions yet.</li>`}</ul></div>`}
  return topbar("Accreditation support","Evidence, audits, document reviews and corrective actions in one place.")+tabs([["evidence","NABH evidence"],["audits","Audit calendar"],["policies","Policies and SOPs"],["actions","Corrective actions"]],accTab,"accTabs")+body;
},after(){
  document.querySelectorAll("#accTabs [data-tab]").forEach(b=>b.onclick=()=>{accTab=b.dataset.tab;render(false)});
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=async()=>{const items=(S.content.nabh.items||[]).map(i=>i.id===b.dataset.ev?{...i,ready:!i.ready}:i);try{await S.db.doc("content/nabh").update({items})}catch(e){writeErr(e)}});
  document.querySelectorAll("[data-aud]").forEach(b=>b.onclick=async()=>{const u=S.audits.find(x=>x.id===b.dataset.aud);try{await S.db.collection("audits").doc(u.id).update({status:"done",doneOn:today()});const add={Monthly:1,Quarterly:3,Annual:12}[u.frequency];if(add){const d=new Date(u.due+"T00:00:00");d.setMonth(d.getMonth()+add);await S.db.collection("audits").add({title:u.title,due:d.toISOString().slice(0,10),status:"open",frequency:u.frequency});toast("Done. Next one scheduled for "+fmtDate(d.toISOString().slice(0,10)))}else toast("Audit marked done")}catch(e){writeErr(e)}});
  document.querySelectorAll("[data-pol]").forEach(b=>b.onclick=async()=>{try{await S.db.collection("policies").doc(b.dataset.pol).update({lastReviewed:today()});toast("Review recorded")}catch(e){writeErr(e)}});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{try{await S.db.collection("actions").doc(b.dataset.act).update({status:"done",closedOn:today()});toast("Action closed")}catch(e){writeErr(e)}});
  const na=$("#newAct");if(na)na.onclick=()=>{openForm="action";location.hash="record"};
  const fa=$("#audAdd");if(fa)fa.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(fa));try{await S.db.collection("audits").add({...d,status:"open"});fa.reset();toast("Audit scheduled")}catch(x){writeErr(x)}};
  const fp=$("#polAdd");if(fp)fp.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(fp));d.everyMonths=+d.everyMonths;try{await S.db.collection("policies").add(d);fp.reset();toast("Document added")}catch(x){writeErr(x)}};
}};

/* ---------- learning ---------- */
let openModule=null,quizOpen=false,quizMsg="";
PAGES.learning={html(){
  const ed=S.content.education||{modules:[],quiz:[]},t=TH(),m=S.month;
  const byWard={};S.quiz.forEach(q=>{(byWard[q.ward]||(byWard[q.ward]=[])).push(q.score/q.total*100)});
  const mods=ed.modules.slice().sort((a,b)=>(b.month||"").localeCompare(a.month||""));
  return topbar("Learning","Teaching content for the wards, and a short quiz to check what has landed.")+
  `<div class="grid2"><div class="panel"><div class="ph"><h2>Education content</h2>${S.sample&&S.canWrite?`<button class="btn small primary" id="aiEdu">Draft a teaching note from this month’s alerts</button>`:""}</div><div id="aiEduOut"></div><ul class="list">${mods.map(md=>`<li><div class="main"><b>${esc(md.title)}</b> <span class="pill info">${esc(md.cadence)}</span><div class="small muted">${mLabel(md.month)}. ${esc(md.summary)}</div>${openModule===md.id?`<p style="margin-top:8px;max-width:68ch">${esc(md.body)}</p>`:""}</div><button class="btn small" data-mod="${md.id}">${openModule===md.id?"Hide":"Read"}</button></li>`).join("")}</ul></div>
  <div class="panel"><div class="ph"><h2>Knowledge check</h2><p>${ed.quiz.length} questions</p></div>${quizOpen?`<form id="quizForm"><label class="small" style="display:flex;flex-direction:column;gap:4px;font-weight:700;max-width:280px">Your ward<select name="ward" required>${wardOptions(null)}</select></label>${ed.quiz.map((q,i)=>`<div class="quizq"><fieldset><legend>${i+1}. ${esc(q.q)}</legend>${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" required> ${esc(o)}</label>`).join("")}</fieldset></div>`).join("")}<div class="ctrls"><button class="btn primary">Submit answers</button><button class="btn" type="button" id="quizCancel">Cancel</button></div></form>`:`<p class="muted" style="margin-bottom:12px">Five questions on this month’s topics. Scores are grouped by ward, never by person.</p><button class="btn primary" id="quizStart" ${S.canWrite?"":"disabled"}>Take the quiz</button><div id="quizResult">${quizMsg}</div>`}</div></div>
  <div class="panel" style="margin-top:18px"><div class="ph"><h2>What the scores suggest</h2><p>Quiz scores alongside hand hygiene, ${mLabel(m)}</p></div><div class="tablewrap"><table><thead><tr><th>Ward</th><th class="num">Quiz attempts</th><th class="num">Average score</th><th class="num">Hand hygiene</th><th>Suggestion</th></tr></thead><tbody>${wardIds().map(w=>{const sc=byWard[w]||[];const avg=sc.length?sc.reduce((s,v)=>s+v,0)/sc.length:null;const x=agg(m).wards[w];const hh=x.hhOpp?met(x).hh:null;
    let sug="";if(!sc.length)sug="Ask staff to take the quiz";else if(avg<70&&hh!=null&&hh<t.hhTarget)sug="Knowledge and practice both low. Start bedside teaching.";else if(avg>=70&&hh!=null&&hh<t.hhTarget)sug="Staff know the rules but don’t follow them. Look at dispenser access and workload.";else if(avg<70)sug="Refresh the theory at the next huddle.";else sug="Keep the current routine.";
    return `<tr><td>${esc(wardName(w))}</td><td class="num">${sc.length}</td><td class="num ${avg!=null?"cell-"+sev(avg,70,false):""}">${avg!=null?r0(avg)+"%":"–"}</td><td class="num">${hh!=null?r0(hh)+"%":"Not audited"}</td><td style="white-space:normal">${sug}</td></tr>`}).join("")}</tbody></table></div></div>`;
},after(){
  document.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{openModule=openModule===b.dataset.mod?null:b.dataset.mod;render(false)});
  const qs=$("#quizStart");if(qs)qs.onclick=()=>{quizOpen=true;quizMsg="";render(false)};
  const qc=$("#quizCancel");if(qc)qc.onclick=()=>{quizOpen=false;render(false)};
  const qf=$("#quizForm");if(qf)qf.onsubmit=async e=>{e.preventDefault();const ed=S.content.education;const d=Object.fromEntries(new FormData(qf));const score=ed.quiz.reduce((s,q,i)=>s+(+d["q"+i]===q.a?1:0),0);
    try{await S.db.collection("quiz").add({ward:d.ward,score,total:ed.quiz.length,month:today().slice(0,7),date:today()});quizOpen=false;quizMsg=`<p style="margin-top:12px"><b>You scored ${score} of ${ed.quiz.length}.</b></p><ul class="small">${ed.quiz.map((q,i)=>+d["q"+i]===q.a?"":`<li>${esc(q.q)} Answer: ${esc(q.o[q.a])}</li>`).join("")}</ul>`;render(false)}catch(x){writeErr(x)}};
  const ae=$("#aiEdu");if(ae)ae.onclick=()=>askClaude(ae,$("#aiEduOut"),`Write a short teaching note (about 150 words) for nurses and doctors in an Indian hospital, to be read at a ward huddle. Base it on these infection control alerts from ${mLabel(S.month)}:\n${alerts(S.month).filter(a=>a.sev!=="info").slice(0,6).map(a=>"- "+a.title+": "+a.detail).join("\n")}\n\nStart with a title line. Then plain sentences: why it matters and three concrete things to do on the next shift. No markdown symbols.`,async text=>{const lines=text.trim().split("\n").filter(Boolean);const title=lines.shift().replace(/^title:\s*/i,"").slice(0,120);
      return `<div class="ctrls" style="margin-top:8px"><button class="btn small primary" id="eduSave">Add to education content</button></div>`;},text=>{const b=$("#eduSave");if(b)b.onclick=async()=>{const lines=text.trim().split("\n").filter(Boolean);const title=lines.shift().replace(/^title:\s*/i,"").slice(0,120);const ed=S.content.education;const mods=[...ed.modules,{id:"m"+Date.now(),title,cadence:"Weekly",month:today().slice(0,7),summary:lines[0]?.slice(0,140)||"",body:lines.join(" ")}];try{await S.db.doc("content/education").update({modules:mods});toast("Added to education content");$("#aiEduOut").innerHTML=""}catch(e){writeErr(e)}}});
}};

/* ---------- thresholds ---------- */
PAGES.thresholds={html(){const t=TH();const F=[["hhTarget","Hand hygiene target","%"],["cauti","CAUTI target","per 1,000 catheter-days"],["clabsi","CLABSI benchmark","per 1,000 line-days"],["vap","VAP target","per 1,000 ventilator-days"],["ssi","SSI target","% of procedures"],["ucDU","Catheter utilisation limit","ratio"],["clDU","Central line utilisation limit","ratio"],["ventDU","Ventilator utilisation limit","ratio"],["rxTarget","Prescriptions meeting policy","%"],["envTarget","Environmental samples within limits","%"],["mdroRise","MDRO alert when isolates reach","× the usual monthly count"],["abgMin","Minimum isolates to report an antibiogram row","isolates (CLSI M39 uses 30)"]];
  return topbar("Thresholds and wards","Alerts, colours and the briefing all use these numbers. Set them to your hospital’s own benchmarks.")+
  `<div class="panel"><form class="entry" id="thForm">${F.map(([k,l,u])=>`<label>${l}<input name="${k}" type="number" step="0.1" min="0" value="${t[k]}" required><span class="small muted" style="font-weight:400">${u}</span></label>`).join("")}<label>Hospital name<input name="hospital" value="${esc(S.hospital||"")}" placeholder="Demo Hospital"></label><div class="actions"><button class="btn primary" ${S.canWrite?"":"disabled"}>Save thresholds</button></div></form></div>
  <div class="panel"><div class="ph"><h2>Wards</h2><p>${wardIds().length} under surveillance</p></div><div class="tablewrap"><table><thead><tr><th>Ward</th><th>Type</th><th class="num">Beds</th></tr></thead><tbody>${wardIds().map(w=>`<tr><td>${esc(wardName(w))}</td><td>${S.wards[w].type==="icu"?"ICU":"General ward"}</td><td class="num">${S.wards[w].beds||"–"}</td></tr>`).join("")}</tbody></table></div>${S.canWrite?`<h3 style="margin:18px 0 6px">Add a ward</h3>${wardAdder()}`:""}</div>`;
},after(){bindWardAdder();const f=$("#thForm");if(f)f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const hosp=d.hospital;delete d.hospital;for(const k in d)d[k]=+d[k];d.abgMin=Math.max(1,Math.round(d.abgMin));try{await S.db.doc("config/thresholds").set(d);await S.db.doc("config/hospital").set({name:hosp||""});toast("Thresholds saved")}catch(x){writeErr(x)}}}};

/* ---------- Claude ---------- */
function sampleErr(e){return {not_granted:"Claude wasn’t allowed to run. You can allow it from the page’s permissions.",rate_limited:"Too many requests right now. Try again in a minute.",cancelled:"Stopped.",refused:"Claude declined this request.",prompt_too_large:"Too much data to send at once."}[e?.code]||"Claude couldn’t answer just now. Try again."}
function agendaPrompt(m){const a=agg(m),k=met(a.total);return `You are the infection control officer in an Indian hospital preparing the agenda for this month’s Infection Prevention and Control Committee (IPCC) meeting. Using only the data below, write a numbered agenda of 5 to 7 items, most urgent first. For each item give one sentence on the issue and one sentence on the decision the committee needs to make. Plain text, no markdown symbols, no invented numbers.

Month: ${mLabel(m)}
Hospital: hand hygiene ${r0(k.hh)}%, CAUTI ${r1(k.cauti)}, CLABSI ${r1(k.clabsi)}, VAP ${r1(k.vap)} per 1,000 device-days, SSI ${r1(k.ssi)}%, antibiotic use ${r1(ddd100(a))} DDD/100 patient-days, ${k.mdroTotal} MDRO isolates (CRE ${a.total.mdro.CRE||0}).
Alerts:
${alerts(m).slice(0,14).map(x=>"- ["+x.cat+"] "+x.title+": "+x.detail).join("\n")}
Early warnings:
${earlyWarnings(m).slice(0,6).map(e=>"- "+wardName(e.w)+", "+e.s.n+": "+e.why).join("\n")||"- none"}
Open corrective actions:
${S.actions.filter(c=>c.status!=="done").map(c=>"- "+c.title+" (owner "+c.owner+", due "+c.due+")").join("\n")||"- none"}`}
async function askClaude(btn,out,prompt,extraHtml,bind){
  if(!S.sample)return;btn.disabled=true;out.innerHTML=`<div class="ai-out muted">Claude is reading the data…</div>`;
  try{const{text}=await S.sample(prompt,{cache:false,onText:({text})=>{const o=out.querySelector(".ai-out");if(o){o.classList.remove("muted");o.textContent=text}}});
    out.innerHTML=`<div class="ai-out"></div>`;out.querySelector(".ai-out").textContent=text;if(extraHtml){out.insertAdjacentHTML("beforeend",await extraHtml(text));bind&&bind(text)}}
  catch(e){out.innerHTML=`<p class="small" style="color:var(--bad);margin-top:8px">${esc(sampleErr(e))}</p>`}finally{btn.disabled=false}
}

/* ---------- boot ---------- */
async function resolveNames(){if(!S.user)return;const all=[];S.entries.forEach(e=>{all.push(e.by,e.verifiedBy,e.reviewedBy);(e.history||[]).forEach(h=>all.push(h.by))});Object.values(S.alertState).forEach(a=>(a.history||[]).forEach(h=>all.push(h.by)));const ids=[...new Set(all.filter(Boolean))].filter(id=>!(id in S.names));if(!ids.length)return;try{const ps=await S.user.profiles(ids);ids.forEach(id=>S.names[id]=ps[id]?.name||"");scheduleRender()}catch{}}
function sub(path,cb){S.db.collection(path).onSnapshot(snap=>{cb(snap.docs.map(d=>({id:d.id,...d.data()})));S.loaded.add(path);scheduleRender()},err=>{console.error(path,err);S.loaded.add(path);scheduleRender()})}
window.addEventListener("hashchange",route);
route();
(async()=>{
  const use=window.claude?.use?.bind(window.claude);
  if(!use){S.dbChecked=true;render(false);return}
  const [db,user,sample,downloads]=await Promise.all(["db","user","sample","downloads"].map(n=>use(n).catch(()=>null)));
  S.dbChecked=true;S.db=db;S.user=user;S.sample=sample;S.downloads=downloads;
  if(!db){render(false);return}
  if(user){try{S.uid=await user.id()}catch{}try{const c=await user.can("data.write");if(c===false)S.canWrite=false}catch{}}
  sub("monthly",l=>{S.monthly={};l.forEach(d=>S.monthly[d.id]=d)});
  sub("wards",l=>{S.wards={};l.forEach(d=>S.wards[d.id]=d)});
  sub("entries",l=>{S.entries=l;resolveNames()});
  sub("actions",l=>S.actions=l);sub("ra",l=>S.ra=l);sub("audits",l=>S.audits=l);sub("policies",l=>S.policies=l);sub("quiz",l=>S.quiz=l);
  sub("config",l=>{S.th=l.find(d=>d.id==="thresholds")||null;const h=l.find(d=>d.id==="hospital");S.hospital=h?.name||"";$("#hospName").textContent=S.hospital||"Demo Hospital"});
  sub("content",l=>{S.content={};l.forEach(d=>S.content[d.id]=d)});
  sub("alertState",l=>{S.alertState={};l.forEach(d=>S.alertState[d.id]=d);resolveNames()});
  try{const mq=matchMedia("(prefers-color-scheme: dark)");mq.addEventListener("change",()=>render(false))}catch{}
  new MutationObserver(()=>render(false)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();
</script>
</body>
